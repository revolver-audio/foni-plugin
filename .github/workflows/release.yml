name: Publish release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['downloads/**', '.github/workflows/release.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release with installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(ls downloads/*.exe | sed -E 's/.*FONI-([0-9.]+)-.*/\1/')
          TAG="v${VER}-beta"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" downloads/*.exe downloads/*.pkg --clobber
            exit 0
          fi
          gh release create "$TAG" downloads/*.exe downloads/*.pkg --target "$GITHUB_SHA" \
            --title "FONI ${VER} beta" --prerelease \
            --notes "Free public beta of FONI, the voice leveler for podcast and YouTube by Revolver Audio. Windows: VST3, CLAP, standalone. macOS: VST3, AU, CLAP, standalone. Installers are not code-signed yet; see https://revolver-audio.github.io/foni-plugin/#download for the SmartScreen and Gatekeeper steps."
