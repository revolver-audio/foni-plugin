name: Publish release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['downloads/**', '.github/workflows/release.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release with installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # newest Windows installer decides the release; attach the matching mac pkg if there is one
          EXE=$(ls downloads/FONI-*-Windows-Setup.exe | sort -V | tail -1)
          VER=$(basename "$EXE" | sed -E 's/FONI-([0-9.]+)-.*/\1/')
          TAG="v${VER}-beta"
          FILES="$EXE"
          [ -f "downloads/FONI-${VER}-macOS.pkg" ] && FILES="$FILES downloads/FONI-${VER}-macOS.pkg"
          echo "version $VER, files: $FILES"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
            exit 0
          fi
          gh release create "$TAG" $FILES --target "$GITHUB_SHA" \
            --title "FONI ${VER} beta" --prerelease \
            --notes "Free public beta of FONI, the voice leveler for podcast and YouTube by Revolver Audio. Windows: VST3, CLAP, standalone. macOS: VST3, AU, CLAP, standalone. Installers are not code-signed yet; see https://revolver-audio.github.io/foni-plugin/#download for the SmartScreen and Gatekeeper steps."
